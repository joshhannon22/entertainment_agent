# 2 from the start: proves stateless_http works across replicas (no MCP session pinning).
replicaCount: 2

image:
  repository: tools-server
  tag: v3
  pullPolicy: IfNotPresent

# Created by hand (kubectl create secret), never by this chart. Only this Deployment references it.
existingSecret: tools-server-secrets

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi