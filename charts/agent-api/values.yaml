replicaCount: 1

image:
  repository: agent-api
  tag: v1
  pullPolicy: IfNotPresent

service:
  port: 80

# Non-secret runtime config -> ConfigMap -> env vars
config:
  MODEL: gemini-3.8-flash
  ADK_MAX_LLM_CALLS: "6"
  GOOGLE_GENAI_USE_VERTEXAI: "FALSE"

# The Secret is created by hand (kubectl create secret), never by this chart.
existingSecret: agent-api-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
